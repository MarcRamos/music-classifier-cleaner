[tool.poetry]
name = "music-classifier-cleaner"
version = "1.0.1"
description = "Classify, organise, BPM-tap and download music"
authors = []
readme = "README.md"
packages = [{ include = "music_classifier" }]

[tool.poetry.dependencies]
python = "^3.10"
requests = "*"
rapidfuzz = "*"
mutagen = "*"
click = ">=8.3.1,<9.0.0"
pygame = ">=2.6.1,<3.0.0"
tqdm = "*"
yt-dlp = "*"
pygame-ce = "^2.5.7"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"

[tool.poetry.scripts]
classify-organize = "music_classifier.cli:classify_organize_main"
scan-library = "music_classifier.cli:scan_library_main"
discover-from-library = "music_classifier.cli:discover_from_library_main"
tag-library-genres = "music_classifier.cli:tag_library_genres_main"
download-ytmusic = "music_classifier.cli:download_ytmusic_main"
archive-download = "music_classifier.pipeline:archive_download"
music-tapper = "music_classifier.pipeline:music_tapper"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
